name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

jobs:
  test:
    name: Go tests and rule workflow
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go tests
        run: go test ./...

      - name: Run runtime apply shell integration
        run: bash tests/clashctl_runtime_apply_test.sh

      - name: Run rule workflow CLI integration
        run: bash tests/rules_workflow_cli_test.sh
